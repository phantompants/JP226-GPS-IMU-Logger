[platformio]
default_envs = m5stack-stamps3

[env:m5stack-stamps3]
extra_scripts = pre:shared/version.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3
  -Ishared
lib_deps =
  https://github.com/m5stack/M5Cardputer.git#1.2.0
  https://github.com/m5stack/M5Unified.git#0.2.22
  mikalhart/TinyGPSPlus@1.1.0
  bblanchon/ArduinoJson@7.4.3
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0

; M5Stack Core2 with a GPS unit on the red Grove Port A. Flash over USB.
[env:m5stack-core2]
extra_scripts = pre:shared/version.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
build_flags =
  -DJP226_CORE2=1
  -DCORE_DEBUG_LEVEL=3
  -Ishared
; The Wi-Fi setup page needs the Cardputer keyboard.
build_src_filter = +<*> -<WifiSetupPage.cpp>
lib_deps =
  https://github.com/m5stack/M5Unified.git#0.2.22
  mikalhart/TinyGPSPlus@1.1.0
  bblanchon/ArduinoJson@7.4.3
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0

[env:native]
platform = native
test_build_src = true
test_filter = test_schedule
build_src_filter = +<LogSchedule.cpp>

