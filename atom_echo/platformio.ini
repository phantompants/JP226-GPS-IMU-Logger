[platformio]
default_envs = m5stack-atom-echo

; M5Stack Atom Echo: spoken alerts and a waypoint button for the Cardputer ADV.
; Runs bare or on an Atomic SPK base (speaker only: the base's SD pins are the
; Echo's audio pins, so leave its SD slot empty).
[env:m5stack-atom-echo]
extra_scripts = pre:../shared/version.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-atom
framework = arduino
monitor_speed = 115200
; The Atom's CH552 USB bridge is unreliable at higher rates.
upload_speed = 115200
; The spoken clips need more than the default 1.25 MB app partition.
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -I../shared
lib_deps =
  https://github.com/m5stack/M5Unified.git#0.2.22
