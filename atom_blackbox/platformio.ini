[platformio]
default_envs = m5stack-atom-blackbox

; M5Stack Atom Lite on an Atomic SPK base: a backup "black box" logger that
; records the Cardputer's position reports to the base's microSD card.
[env:m5stack-atom-blackbox]
extra_scripts = pre:../shared/version.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-atom
framework = arduino
monitor_speed = 115200
; The Atom's CH552 USB bridge is unreliable at higher rates.
upload_speed = 115200
; Room to grow: the default 1.25 MB app partition is already 94% full.
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -I../shared
lib_deps =
  https://github.com/m5stack/M5Unified.git#0.2.22
